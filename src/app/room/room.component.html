<div style="padding: 13px;">
  @if (rooms.length === 0) {
    <mat-spinner></mat-spinner>
  }
  @for (room of rooms; track room) {
    <mat-card style="margin-top:11px;">
      <mat-card-content routerLink="/devices/{{deviceId}}/rooms/{{room}}">
        <mat-card-title>{{room}}</mat-card-title>
      </mat-card-content>
    </mat-card>
  }
</div>
