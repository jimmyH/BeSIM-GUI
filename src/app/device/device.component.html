<div style="padding: 13px;">
  @if (devices.length === 0) {
    <mat-spinner></mat-spinner>
  }
  @for (device of devices; track device) {
    <mat-card style="margin-top:11px;">
      <!-- <mat-card-header>
      <mat-card-title>{{device}}</mat-card-title>
    </mat-card-header> -->
    <mat-card-content routerLink="/devices/{{device}}">
      <mat-card-title>{{device}}</mat-card-title>
    </mat-card-content>
  </mat-card>
}
</div>
