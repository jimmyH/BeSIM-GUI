[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
incremental = false

[package]
name = "besim_gui_dioxus"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
dioxus-router = "0.7"
dioxus-logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
plotters = "0.3"
plotters-canvas = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "HtmlSelectElement", "HtmlInputElement", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
console_error_panic_hook = "0.1"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
